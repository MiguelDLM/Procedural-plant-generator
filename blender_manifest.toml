schema_version = "1.0.0"

id = "procedural_plant_generator"
version = "0.3.0"
name = "Procedural Plant Generator"
tagline = "Botanical trait-driven tree generator"
maintainer = "Miguel Diaz de Leon-Munoz <migueldlm1307@gmail.com>"
type = "add-on"

tags = ["Add Mesh", "Modeling", "Animation"]

blender_version_min = "4.2.0"

description = """
Procedural Plant Generator builds trees from measurable botanical traits:
- Allometry (DBH, height, crown radius) and a beta crown envelope.
- Halle-Oldeman architecture, apical dominance, phyllotaxis, tropisms and self-weight bending.
- Leaf-architecture descriptors (base/apex angles, lobes, teeth, compound leaves, needles) with
  hierarchical venation rendered into leaf textures (VLA-sized areoles, seasonal senescence).
- Leaf-area-index driven foliage, procedural bark, and a trait space for blending species and variants.
"""

license = ["SPDX:GPL-3.0-or-later"]

platforms = ["windows-x64", "macos-arm64", "macos-x64", "linux-x64"]

[permissions]
files = "Import/export botanical presets and trait data"
